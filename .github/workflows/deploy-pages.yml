name: Deploy to GitHub Pages

on:
  push:
    branches: [experiment/fall-recruiting-mvp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - run: npm run generate:notes

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # SPA 路由直刷兜底
      - run: cp dist/index.html dist/404.html

      - run: touch dist/.nojekyll

      # The pilot hides legacy courses and narration. Keeping their generated
      # media in the Pages artifact added roughly 66 MB without serving any
      # reachable pilot route, leaving almost no margin under deploy-pages'
      # fixed ten-minute backend timeout. Source assets remain untouched.
      - name: Prepare pilot artifact
        run: |
          rm -rf dist/audio
          rm -rf dist/notes/image

      - name: Report Pages artifact
        run: |
          echo "Files: $(find dist -type f | wc -l | tr -d ' ')"
          echo "Size: $(du -sh dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages caps this value at 600000 ms. A larger value is
          # ignored, so artifact size must leave enough processing margin.
          timeout: 600000
          error_count: 30
          reporting_interval: 10000
